<ion-toolbar>
  <ion-buttons slot="start" *ngIf="mostrarBackButton">
    <ion-button (click)="volver()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </ion-button>
  </ion-buttons>
  <ion-title>Soporte TI - Rucaray</ion-title>
  <ion-buttons slot="secondary">
    <ion-button (click)="abrirNotificaciones($event)" class="boton-notif">
      <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      <ion-badge
        *ngIf="noLeidas > 0"
        color="danger"
        class="badge-punto"
      >{{ noLeidas }}</ion-badge>
    </ion-button>
    <ion-button (click)="abrirMenuUsuario()">
      <ion-avatar>
        <img
          alt=""
          src="https://ionicframework.com/docs/img/demos/avatar.svg"
        />
      </ion-avatar>
    </ion-button>
  </ion-buttons>
</ion-toolbar>
