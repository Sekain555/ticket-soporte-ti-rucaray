<ion-header>
  <ion-toolbar>
    <ion-title>Mencionar usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar usuario..."
      (ionInput)="filtrar($event)"
      [debounce]="300"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item
      *ngFor="let u of usuariosFiltrados"
      button
      (click)="seleccionar(u)"
    >
      <ion-avatar slot="start">
        <img
          alt=""
          src="https://ionicframework.com/docs/img/demos/avatar.svg"
        />
      </ion-avatar>
      <ion-label>
        <h3>{{ u.nombre }} {{ u.apellido }}</h3>
        <p>{{ u.puesto || 'Sin puesto' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
